<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Campus Customs — Database Viewer</title>
<style>
  :root{--navy:#00356b;--navy2:#286dc0;--bg:#f5f7fa;--card:#fff;--ink:#1f2933;--muted:#6b7785;--line:#e3e8ee;--ok:#1a7f4b;--low:#b7791f;--out:#c53030}
  *{box-sizing:border-box}
  body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;background:var(--bg);color:var(--ink);line-height:1.5}
  header{background:var(--navy);color:#fff;padding:28px 40px 0}
  header h1{margin:0;font-size:26px;letter-spacing:.3px}
  header p{margin:4px 0 20px;opacity:.8;font-size:14px}
  .stats{display:flex;gap:14px;flex-wrap:wrap;margin-bottom:22px}
  .stat{background:rgba(255,255,255,.1);border-radius:10px;padding:10px 16px;min-width:130px}
  .stat b{display:block;font-size:22px}.stat span{font-size:12px;opacity:.8;text-transform:uppercase;letter-spacing:.6px}
  nav{display:flex;gap:4px}
  nav button{background:none;border:0;color:#fff;opacity:.7;padding:12px 18px;font-size:15px;cursor:pointer;border-radius:8px 8px 0 0}
  nav button.active{background:var(--bg);color:var(--navy);opacity:1;font-weight:600}
  main{padding:28px 40px;max-width:1400px;margin:0 auto}
  .tab{display:none}.tab.active{display:block}
  .toolbar{display:flex;gap:12px;flex-wrap:wrap;align-items:center;margin-bottom:20px}
  input[type=search],select{padding:10px 14px;border:1px solid var(--line);border-radius:8px;font-size:14px;background:#fff}
  input[type=search]{flex:1;min-width:240px}
  .count{color:var(--muted);font-size:14px}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:20px}
  .card{background:var(--card);border-radius:12px;overflow:hidden;box-shadow:0 1px 3px rgba(0,0,0,.06);border:1px solid var(--line);display:flex;flex-direction:column}
  .card img{width:100%;aspect-ratio:1;object-fit:contain;background:#fafbfc;border-bottom:1px solid var(--line)}
  .card .body{padding:14px 16px;display:flex;flex-direction:column;gap:8px;flex:1}
  .card h3{margin:0;font-size:16px}
  .row{display:flex;justify-content:space-between;align-items:center}
  .price{font-weight:700;color:var(--navy);font-size:17px}
  .type{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.5px}
  .desc{font-size:13px;color:#46515e;margin:0}
  .chips{display:flex;flex-wrap:wrap;gap:5px}
  .chip{font-size:11px;padding:2px 8px;border-radius:999px;background:#eef2f7;color:#3d4a5a}
  .chip.color{background:#e8f0fb;color:var(--navy)}
  .sizes{display:grid;grid-template-columns:repeat(6,1fr);gap:4px;margin-top:auto}
  .sz{text-align:center;border-radius:6px;padding:4px 0;font-size:11px;border:1px solid var(--line)}
  .sz b{display:block;font-size:13px}
  .sz.ok{background:#eaf7ef;color:var(--ok)}.sz.low{background:#fdf5e6;color:var(--low)}.sz.out{background:#fdecec;color:var(--out)}
  .pid{font-family:ui-monospace,Menlo,monospace;font-size:11px;color:var(--muted)}
  table{width:100%;border-collapse:collapse;background:#fff;border-radius:12px;overflow:hidden;border:1px solid var(--line);font-size:14px}
  th{background:#eef2f7;text-align:left;padding:10px 14px;font-size:12px;text-transform:uppercase;letter-spacing:.5px;color:#46515e;position:sticky;top:0;cursor:pointer;user-select:none}
  td{padding:9px 14px;border-top:1px solid var(--line);vertical-align:top}
  tr:hover td{background:#f8fafc}
  .mono{font-family:ui-monospace,Menlo,monospace;font-size:12px}
  .pill{padding:2px 10px;border-radius:999px;font-size:12px;font-weight:600}
  .pill.ok{background:#eaf7ef;color:var(--ok)}.pill.low{background:#fdf5e6;color:var(--low)}.pill.out{background:#fdecec;color:var(--out)}
  .convo{background:#fff;border:1px solid var(--line);border-radius:12px;padding:18px 20px;margin-bottom:22px}
  .convo h3{margin:0 0 14px;font-size:16px}.convo h3 small{color:var(--muted);font-weight:400}
  .msg{max-width:78%;padding:10px 14px;border-radius:14px;margin:8px 0;font-size:14px;white-space:pre-wrap}
  .msg.user{background:var(--navy2);color:#fff;margin-left:auto;border-bottom-right-radius:4px}
  .msg.assistant{background:#eef2f7;border-bottom-left-radius:4px}
  .meta{font-size:11px;opacity:.7;margin-top:6px}
  .schema{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:20px}
  .schema h3{margin:0 0 10px;font-size:16px;color:var(--navy)}
  .schema .box{background:#fff;border:1px solid var(--line);border-radius:12px;padding:16px}
  .schema table{border:0;font-size:13px}
  .note{color:var(--muted);font-size:13px;margin:-8px 0 18px}
</style>
</head>

<header>

</header>

  <section class="tab" id="users">

    <table id="userTable"></table>

  <section class="tab" id="chats"><div id="chatList"></div></section>
  <section class="tab" id="schema"><div class="schema" id="schemaBox"></div></section>
</main>

const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const lvl = q => q === 0 ? "out" : q <= 5 ? "low" : "ok";
const SIZES = ["XS","S","M","L","XL","XXL"];
const invBy = {};
D.inv.forEach(r => (invBy[r.product_id] ||= {})[r.size] = r.quantity);
const nameBy = Object.fromEntries(D.cat.map(c => [c.product_id, c.name]));

// Catalogue
[...new Set(D.cat.map(c=>c.garment_type))].sort().forEach(t => $("#catType").insertAdjacentHTML("beforeend", `<option>${esc(t)}</option>`));
function renderCat(){
  const s = $("#catSearch").value.toLowerCase(), t = $("#catType").value, sort = $("#catSort").value;
  let list = D.cat.filter(c => (!t || c.garment_type===t) && (!s || [c.name,c.description,c.product_id,...c.colors,...c.search_tags].join(" ").toLowerCase().includes(s)));
  const f = {name:(a,b)=>a.name.localeCompare(b.name),"price-asc":(a,b)=>a.price-b.price,"price-desc":(a,b)=>b.price-a.price,stock:(a,b)=>b.stock-a.stock}[sort];
  list.sort(f);
  $("#catCount").textContent = `${list.length} of ${D.cat.length} products`;
  $("#catGrid").innerHTML = list.map(c => { const inv = invBy[c.product_id]||{}; return `
    <div class="card">
      <img loading="lazy" src="${esc(c.image_file_path)}" alt="${esc(c.name)}">
      <div class="body">
        <div class="row"><span class="type">${esc(c.garment_type)}</span><span class="price">$${c.price.toFixed(2)}</span></div>
        <h3>${esc(c.name)}</h3>
        <div class="pid">${esc(c.product_id)}</div>
        <p class="desc">${esc(c.description)}</p>
        <div class="chips">${c.colors.map(x=>`<span class="chip color">${esc(x)}</span>`).join("")}</div>
        <div class="chips">${c.search_tags.map(x=>`<span class="chip">${esc(x)}</span>`).join("")}</div>
        <div class="row"><span class="type">Stock by size</span><span class="type">${c.stock} total</span></div>
        <div class="sizes">${SIZES.map(z => inv[z]==null ? `<div class="sz">${z}<b>–</b></div>` : `<div class="sz ${lvl(inv[z])}">${z}<b>${inv[z]}</b></div>`).join("")}</div>
      </div>
    </div>`}).join("");
}
["#catSearch","#catType","#catSort"].forEach(id => $(id).oninput = renderCat);
renderCat();

// Sortable table helper
function table(el, cols, rows){
  let key = null, dir = 1;
  const draw = () => {
    const r = key ? [...rows].sort((a,b)=> (a[key]>b[key]?1:a[key]<b[key]?-1:0)*dir) : rows;
    el.innerHTML = `<thead><tr>${cols.map(c=>`<th data-k="${c.k}">${c.h}${key===c.k?(dir>0?" ▲":" ▼"):""}</th>`).join("")}</tr></thead>
      <tbody>${r.map(row=>`<tr>${cols.map(c=>`<td>${c.f?c.f(row):esc(row[c.k])}</td>`).join("")}</tr>`).join("")}</tbody>`;
    el.querySelectorAll("th").forEach(th => th.onclick = () => { dir = key===th.dataset.k ? -dir : 1; key = th.dataset.k; draw(); });
  };
  draw();
}

// Inventory
function renderInv(){
  const s = $("#invSearch").value.toLowerCase(), st = $("#invStatus").value;
  const rows = D.inv.map(r=>({...r, name:nameBy[r.product_id]||r.product_id}))
    .filter(r => (!st || lvl(r.quantity)===st) && (!s || (r.name+" "+r.product_id+" "+r.size).toLowerCase().includes(s)));
  $("#invCount").textContent = `${rows.length} of ${D.inv.length} rows`;
  table($("#invTable"), [
    {k:"id",h:"ID"},{k:"name",h:"Product",f:r=>`${esc(r.name)}<div class="pid">${esc(r.product_id)}</div>`},
    {k:"size",h:"Size"},{k:"quantity",h:"Quantity",f:r=>`<span class="pill ${lvl(r.quantity)}">${r.quantity}</span>`}], rows);
}
["#invSearch","#invStatus"].forEach(id => $(id).oninput = renderInv);
renderInv();

// Chats grouped by user

const byUser = {}; D.msgs.forEach(m => (byUser[m.user_id] ||= []).push(m));
$("#chatList").innerHTML = Object.entries(byUser).map(([uid, ms]) => `
  <div class="convo"><h3>${esc(userBy[uid]?.name || "User "+uid)} <small>· ${esc(userBy[uid]?.email||"")} · ${ms.length} messages</small></h3>
  ${ms.map(m=>`<div class="msg ${m.role==="user"?"user":"assistant"}">${esc(m.content)}<div class="meta">#${m.id} · ${esc(m.created_at)}${m.has_products?" · 🛍 products attached":""}</div></div>`).join("")}
  </div>`).join("");

$("#schemaBox").innerHTML = Object.entries(D.schema).map(([t, cols]) => `
  <div class="box"><h3>${t} <small class="count">(${D.counts[t]} rows)</small></h3>
  <table><thead><tr><th>Column</th><th>Type</th><th>Key / Null</th></tr></thead><tbody>
  ${cols.map(c=>`<tr><td class="mono">${esc(c.name)}</td><td>${esc(c.type)}</td><td>${c.pk?"🔑 PK":""}${c.notnull?" NOT NULL":""}</td></tr>`).join("")}
  </tbody></table></div>`).join("");
